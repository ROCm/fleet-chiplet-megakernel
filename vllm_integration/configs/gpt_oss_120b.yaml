## GPT-OSS 120B MoE model configuration for Fleet MK code generator
## Source: /home/claudeuser/models/gpt-oss-120b/config.json
##
## Usage: python3 fleet_mk_generate.py configs/gpt_oss_120b.yaml

model:
  name: gpt-oss-120b
  arch: moe
  num_layers: 36
  hidden_size: 2880
  intermediate_size: 2880           # dense intermediate (not used for MoE FFN)
  vocab_size: 201088
  num_q_heads: 64
  num_kv_heads: 8
  head_dim: 64
  activation: swiglu
  has_qk_norm: false
  has_bias: true                    # attention_bias=True
  rope_theta: 150000.0
  rms_norm_eps: 1.0e-5
  max_position_embeddings: 131072

moe:
  num_experts: 128
  num_experts_per_tok: 4
  moe_intermediate_size: 2880
  shared_expert_intermediate_size: 0  # no shared expert
  ## w13_output_per_wg / w2_output_per_wg live in the `measured:` section below:
  ## they are search results, not properties of the model.

gpu:
  target: gfx950
  num_xcds: 8
  workers_per_xcd: 30
  ## KV pages, in tokens. Compile-time: it is a template parameter to both
  ## rope_kv_update and paged_attention_minimal_decode_hd64, so the driver's
  ## page_size and the kernel's PAGE_SIZE must be generated together or KV
  ## addressing is silently wrong.
  ##
  ## 16 rather than 4096 because fleet_megakernel_vllm aliases vLLM's KV pool zero-copy,
  ## which requires block_size == PAGE_SIZE, and 16 is vLLM's *default* ROCm
  ## block size. Running at the default is the point: it means fleet_mk binds to a
  ## stock-configured engine with no block_size override, rather than requiring
  ## every caller to know fleet_mk's page size.
  ##
  ## History: 4096 -> 128 was the first step (vLLM caps block_size at 256,
  ## BlockSize = Literal[1, 8, 16, 32, 64, 128, 256] in vllm/config/cache.py),
  ## measured free at 2.501 -> 2.491 ms/tok with identical registers. 128 was
  ## chosen then as the largest power of two fitting the aiter unified backend's
  ## LDS budget (block_size * 1024 B against 160 KB).
  ##
  ## PAGE_SIZE only feeds address arithmetic (kv_indices[tok / PAGE_SIZE],
  ## tok % PAGE_SIZE) and seqlen_k -- no LDS sizing, no unroll factor -- so
  ## there is no reason to expect a page-size sweep to pay either way. What 16
  ## *does* change is that a 512-token sequence now spans 32 pages instead of 4,
  ## so kv_indices is 8x longer and the per-page indirection runs 8x as often.
  ## That is address arithmetic, not bandwidth, but it is not nothing -- measure
  ## rather than assume the 128 number carries over.
  page_size: 16
  max_seq_len: 512
  num_kv_chunks: 8

quantization:
  weight_format: mxfp4
  output_per_wg: 64

attention:
  ## GPT-OSS alternates attention types per layer: even layers are
  ## "sliding_attention" with a 128-token window, odd layers are
  ## "full_attention" (window 0 = unlimited). Only 'uniform' and 'alternating'
  ## are supported -- anything else needs a new emitter arm, not a new value.
  sliding_window: 128
  sliding_window_pattern: alternating

build:
  ## The live 2.548 ms/tok build uses all of these. The dense models keep the
  ## O2 / no-rdc / no-extra / mirage-headers defaults so their build scripts stay
  ## byte-identical -- check_roundtrip.py gates that.
  opt_level: O3
  rdc: true

  ## GPT-OSS is the only config ported to fleet's calling convention, so it is
  ## the only one that may flip the header tree. Setting this also emits
  ## -DFLEET_MK_FLEET_HEADERS, -DMPK_MAX_NUM_BATCHED_REQUESTS=1 and
  ## -DMPK_PREFETCH_NEXT_QKV: those are the convention, not tuning, and two of
  ## the three miscompile SILENTLY if dropped, so they are derived from this key
  ## rather than listed by hand in extra_defines.
  ##
  ## Fleet is used out of the box -- on the include path, never copied, never
  ## edited. Branch amd&lowbar;mi355&lowbar;gpt&lowbar;oss120b.
  ##
  ## The pin is not a value in this file: header&lowbar;dir points at this very
  ## checkout, so "moving the pin" is a git merge of upstream into our branch,
  ## and the pin is whatever our HEAD's merge-base with
  ## origin/amd&lowbar;mi355&lowbar;gpt&lowbar;oss120b is. Recorded here because the number is
  ## otherwise invisible from the config.
  ##
  ## 2026-09-02: 2ee5278 -> 9d478ea ("Decode 1.70 -> 1.64 ms: pin each routed
  ## expert to one XCD pair"), 7 commits, 18 files, +5503/-307. Seven of those
  ## files are headers this kernel includes, including the three heaviest
  ## (gang&lowbar;moe&lowbar;fused&lowbar;mxfp4 +2040, paged&lowbar;attention&lowbar;decode&lowbar;minimal&lowbar;hd64
  ## +900, gang&lowbar;full&lowbar;layer&lowbar;fused +453).
  ##
  ## MEASURED FREE, which is the point of landing it alone: 2 interleaved
  ## rounds, medians 1.889 vs 1.889 ms, delta +0.000 against a 0.020 spread --
  ## "within run-to-run noise, not resolvable". LDS still 736, tok1=35644,
  ## coherent text both arms. The ISA moved by +27 instructions across 39
  ## mnemonics with ZERO change to the mfma / ds&lowbar;\* / buffer&lowbar;\* counts: the
  ## churn is e32/e64 encoding swaps that cancel (v&lowbar;cmp&lowbar;lt&lowbar;i32 e32 +11 /
  ## e64 -11, v&lowbar;cndmask e32 +9 / e64 -8). That is the expected shape for a
  ## header bump whose new code is all #ifdef-gated OFF in our build.
  ##
  ## So the 1.64 ms is NOT in this build yet. Upstream's wins are behind four
  ## flags not in extra&lowbar;defines below -- MPK&lowbar;W13&lowbar;KMAJOR&lowbar;RECYCLE (+ its host
  ## permute), MPK&lowbar;W13&lowbar;T1&lowbar;BIAS&lowbar;EARLY, MPK&lowbar;LM&lowbar;HEAD&lowbar;GROUP&lowbar;PIPELINE and
  ## MPK&lowbar;MOE&lowbar;XCD&lowbar;PAIR (+ MPK&lowbar;EARLY&lowbar;ROUTING) -- each landed separately so
  ## each carries its own number. Note W13&lowbar;KMAJOR&lowbar;RECYCLE #errors against
  ## MPK&lowbar;W13&lowbar;T1&lowbar;SPLIT&lowbar;LDS&lowbar;STAGE, which IS in the list below and has to
  ## come out in the same change.
  ##
  ## Since this tree moved under fleet (as vllm&lowbar;integration/), header&lowbar;dir names
  ## its OWN grandparent. It is still an absolute path rather than a derived one
  ## because it is interpolated into the emitted build script, which
  ## check&lowbar;roundtrip.py compares BYTE for byte -- deriving it would change those
  ## bytes and would have to be landed as a regeneration, not an edit. The
  ## emitted script honours $FLEET&lowbar;DIR from the environment, so a checkout
  ## elsewhere overrides it without touching this file.
  headers: fleet
  header_dir: /home/claudeuser/fleet-chiplet-megakernel

  ## MPK_W13_LDS_PREFETCH is NOT in extra_defines: it needs to be switchable off
  ## from the environment (FLEET_MK_NO_W13_PREFETCH=1) so an A/B pair can differ in
  ## the prefetch and nothing else.
  w13_prefetch_toggle: true

  ## Fleet's shipped-on optimization set.
  ##
  ## Every one of these is #ifdef-gated in fleet's headers with NO default, and
  ## fleet turns them on from python/mirage/mpk/persistent_kernel.py via
  ## mpk_opt(), whose contract is "default ON; MPK_<name>=0 disables". That build
  ## path is mirage's, which this tree deliberately does not use -- so before
  ## this list existed we compiled fleet's headers with every optimization
  ## inside them switched OFF. We were running fleet's slow path while including
  ## fleet's fast code. That, not the header pin, is the bulk of the gap against
  ## fleet's own 1.835 ms.
  ##
  ## Listed explicitly rather than derived: fleet's set for gpt-oss-120b at
  ## batch 1, transcribed at upstream 2ee5278. One of fleet's is deliberately
  ## absent --
  ##   MPK_NDEBUG         disables device asserts. The instrumentation is worth
  ##                      more here than the cycles, and it is the one flag
  ##                      whose "win" cannot be verified by measurement.
  ##
  ## MPK_OPROJ_KMAJOR is host-coupled: the flag rewrites the kernel's LDS
  ## address arithmetic and the host must repack the O-proj tile to match.
  ## Setting one side only is not a build error and not a crash -- every lane
  ## reads a valid byte of the tile, just the wrong one -- so it is silently
  ## wrong numerics, which is why fleet's own demo warns about it. Listing it
  ## here is what turns the host repack ON: emit_oproj_kmajor_shuffle derives
  ## the driver's shuffle_oproj_workgroups_kmajor call from this same entry, so
  ## the broken half-configuration cannot be expressed. Removing it from this
  ## list removes both halves together.
  ##
  ## It is kept on FLEET PARITY, not on measurement: 5 interleaved rounds put it
  ## at +3.6 us/token median on the device-side layers timer with the sign
  ## flipping across rounds (-5.2 .. +11.7), and +0.007 ms on wall clock against
  ## a 0.040 spread. Both read as noise. That is the expected result once the
  ## disassembly is read -- the flag trades 8 v&lowbar;add3/v&lowbar;lshlrev for 8 v&lowbar;lshl&lowbar;add
  ## (net -6 instructions) and changes NO memory-op or MFMA count, so any win
  ## has to come from LDS bank conflicts at run time, and at OPW=16 there are
  ## not enough to find. Do not re-run this experiment expecting a win; do not
  ## drop the flag expecting one either. It is here so this tree's flag set
  ## equals fleet's, which is the thing that was actually worth 0.9 ms.
  ##
  ## Measuring it needed a harness change: MPK&lowbar;OPROJ&lowbar;KMAJOR is the first
  ## host-coupled flag, and ab&lowbar;interleave.sh swapped only the .so, so the
  ## baseline arm ran the NEW driver against the OLD .so -- the silent
  ## half-configuration, manufactured by the instrument. It came back as fluent
  ## garbage at next&lowbar;token=21173. Use DRIVER&lowbar;A / DRIVER&lowbar;B for any flag whose
  ## effect reaches the host.
  ##
  ## MPK_SYS_POLL_LOAD is a LEVEL, not a boolean, and that is why it was
  ## missing from this list for as long as it was. The list below was built by
  ## scanning fleet's persistent_kernel.py for `_opt(` call sites, which finds
  ## every boolean flag and structurally cannot find this one: it is set from
  ## `int(os.environ.get("MPK_SYS_POLL_LOAD", "2"))` at :730, defaulting to 2.
  ## The gap was caught by reading the `Compiling megakernel using the
  ## following command line:` banner in fleet's own demo log -- the compiler
  ## invocation is ground truth, and a scan of the code that BUILDS it is not.
  ##
  ## What it does: swaps every release-gate poll from `ld_nt_s32` to
  ## `ld_sys_s32` (`global_load_dword ... sc0 sc1`). Level 1 converts the
  ## fused-layer gates (qkv_epoch / attn_release / routing_ready /
  ## layer_release), level 2 additionally converts the two per-XCD barriers
  ## inside MoE and O-proj. Six live sites in the headers we compile.
  ##
  ## Why it should matter here: `nt` is only an eviction HINT -- it does not
  ## force a vL1 miss -- so a spin on an `nt` load can keep re-reading a stale
  ## line until that line ages out. That is a long tail on exactly the sites
  ## that are already hottest, and this tree's own ATT work
  ## ([[att-trace-2114us-breakdown]]) put barriers at 12% of decode.
  ##
  ## Measured, 3 interleaved rounds, and it is the first flag since the bulk
  ## transcription that both instruments resolve in the same direction:
  ##   device `layers`  1802.2 -> 1763.5 us  (-38.7, -1.07 us/layer, -2.14%),
  ##                    sign held in all 3 rounds, range -40.8 .. -21.8
  ##   Non-outlier avg  2.111 -> 2.056 ms    (-0.055 vs 0.023 within-arm spread)
  ## The ISA says why, and it is exactly the predicted edit: instruction counts
  ## are IDENTICAL (13204 both sides, same mfma/ds/buffer/global mix) and only
  ## the cache bits move -- 6 global_load_dword go `nt` -> `sc0 sc1`, 16 -> 10
  ## and 15 -> 21. Six loads, six gate sites, no codegen change.
  ##
  ## Not in this list, and deliberately: FLEET&lowbar;MK&lowbar;TIMER&lowbar;PRINT. The
  ## [FLEET&lowbar;MK&lowbar;TIME] embed/layers/tail line is a device printf, i.e. a HOSTCALL
  ## -- the wave stalls while a host thread drains the buffer. It is worth
  ## 0.164 ms/token, which is larger than every flag in the list above
  ## combined, and it was ON by default in every number this tree quoted before
  ## 2026-09-02.
  ##
  ## Measured as 3 interleaved rounds of the SAME .so built both ways:
  ##   printon  med 2.052 ms  spread 0.010
  ##   printoff med 1.888 ms  spread 0.014
  ##   -> "delta exceeds noise (improvement)", both tok1=35644, text coherent.
  ## The ISA agrees: s&lowbar;sendmsg 0 -> 7 and +1908 instructions across 83
  ## mnemonics, all of it printf formatting.
  ##
  ## It hid because it sits AFTER &lowbar;tail&lowbar;t1, so it is invisible to the very
  ## timer it reports, and because at one decode step per launch the stall
  ## overlaps the launch gap and cancels out of any A/B that leaves it on both
  ## arms -- which was every A/B run here. Fleet does not pay it: its
  ## per-iteration [FWD&lowbar;PASS] dump is gated behind MPK&lowbar;QUIET&lowbar;FWDPASS with a
  ## comment making the same point (persistent&lowbar;kernel.cuh:3663), so leaving
  ## ours on handicapped our own side of every fleet comparison.
  ##
  ## It is an env toggle on the build script rather than an entry here because
  ## attribution work still needs it -- tools/layers&lowbar;timer&lowbar;stats.py parses
  ## those lines. Build with FLEET&lowbar;MK&lowbar;TIMER&lowbar;PRINT=1 to get them back, and
  ## never quote a latency number from that build, for the same reason none is
  ## quoted from a FLEET&lowbar;MK&lowbar;WORKER&lowbar;STATE build.
  ##
  ## Dependency edges the headers enforce with #error, which is why the order
  ## here is not arbitrary:
  ##   ROUTER_DUAL_REDUCE      needs ROUTER_FUSED_DP
  ##   W13_PREQUANT            needs ROUTER_FUSED_DP, and batch 1
  ##   W13_T0_COUNTED_HANDOFF  needs W13_PREQUANT and W13_LINEAR_LOAD
  extra_defines:
    - MPK_ROUTER_FUSED_DP
    - MPK_ROUTER_DUAL_REDUCE
    - MPK_W13_LINEAR_LOAD
    - MPK_W13_T1_LINEAR_LOAD
    - MPK_W13_PREQUANT
    - MPK_W13_T0_COUNTED_HANDOFF
    - MPK_W13_T0_MFMA_UNROLLED
    - MPK_W2_T0_MFMA_UNROLLED
    - MPK_W13_T1_EARLY_SCALE_LOAD
    - MPK_W13_T1_SPLIT_LDS_STAGE
    - MPK_W13_BIAS_PREFETCH
    - MPK_W2_CONSUMER_GATE
    - MPK_W2_ONLY_ARRIVE
    - MPK_WIDE_FP8_QUANT
    - MPK_XCD_LOCAL_BARRIER
    - MPK_OPROJ_TREE_BARRIER
    - MPK_OPROJ_NO_WB
    - MPK_OPROJ_KMAJOR
    - MPK_ONE_NORM_WRITER
    - MPK_LEAN_ARRIVE
    - MPK_QKV_LDS_NORM
    - MPK_QKV_PREFETCH_SCALES
    - MPK_RMSNORM_DPP_REDUCE
    - MPK_TOPK_LOCAL_MAX3
    - MPK_ML_TABLE_PREFETCH
    - MPK_MERGE_TWO_PASS
    - MPK_MERGE_KV_OUTER
    - MPK_ATTN_SLICE_RELEASE
    - MPK_SYS_POLL_LOAD=2

measured:
  ## Search results, not derivations. Each carries the alternative that was tried
  ## and what it cost, so the next person does not re-run the experiment.
  ##
  ## oproj_output_per_wg: pinned, not corrected. The auto-derivation tries
  ## 64, 32, 16 and lands on 16 by itself -- 2944/64 = 46 tiles and 46 % 8 != 0,
  ## so 64 and 32 are both rejected. Declared here so the measured value is
  ## visible next to the other two, and so the derivation is asserted against
  ## it rather than trusted silently.
  oproj_output_per_wg: 16
  ## w13: OPW=64 measured +280 us/tok (2.818 vs 2.537 ms) despite eliminating all
  ## 60 padding tiles. W13 wants FAT tiles -- LDS weight reuse across 2 MFMA rounds.
  w13_output_per_wg: 128
  ## w2: OPW=128 measured +142 us/tok (2517 vs 2375 us) despite halving tile count.
  ## W2 wants THIN tiles -- parallelism hides HBM latency. OPPOSITE sign to w13.
  ## Symmetrizing these two is the most tempting and most expensive wrong move.
  w2_output_per_wg: 64
  ## Derivable, and cross-checked against the formula in load_and_validate. The
  ## formula reproduces all three historical values: 53 (128/64), 83 (64/64),
  ## 42 (128/128).
  moe_total_tiles_per_xcd: 53
