[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-megakernel-vllm"
version = "0.1.0"
description = "Fleet MK fused Qwen3 decode megakernel as an out-of-tree vLLM plugin"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools]
packages = ["fleet_megakernel_vllm"]
package-dir = { "fleet_megakernel_vllm" = "." }

# vLLM discovers this entry point at engine startup and calls register(),
# which swaps in FleetMKQwen3ForCausalLM for the Qwen3ForCausalLM architecture.
[project.entry-points."vllm.general_plugins"]
fleet_mk = "fleet_megakernel_vllm.plugin:register"
