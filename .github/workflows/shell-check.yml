name: Shell Check
on: [push, pull_request, workflow_dispatch]

jobs:
  shellcheck:
    name: Shell Script Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: ./deps/** 
          severity: 'error'